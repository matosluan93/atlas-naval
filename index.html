<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Naval</title>
<meta name="description" content="Globo 3D com as batalhas navais da história, animações táticas e material de estudo para fuzileiros navais.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2308131d' stroke='%23e9a23b' stroke-width='2'/%3E%3Cpath d='M16 6v18M9 13h14M8 20q8 8 16 0' stroke='%23e9a23b' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@500;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.139.1/Build/Cesium/Widgets/widgets.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Atlas Naval</h1>
      <span id="count">Carregando batalhas…</span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Buscar batalha, guerra ou ano" autocomplete="off" aria-label="Buscar batalha">
    </div>
    <div class="filters" role="group" aria-label="Filtros">
      <button class="chip" data-f="all" aria-pressed="true">Todas</button>
      <button class="chip" data-f="study" aria-pressed="false">Estudo completo</button>
      <button class="chip" data-f="br" aria-pressed="false">Brasil</button>
      <button class="chip" data-f="amph" aria-pressed="false">Anfíbias</button>
      <select id="era" aria-label="Época">
        <option value="">Todas as épocas</option>
        <option value="-9999,499">Antiguidade</option>
        <option value="500,1499">Idade Média</option>
        <option value="1500,1799">1500–1799</option>
        <option value="1800,1913">1800–1913</option>
        <option value="1914,1918">1ª Guerra Mundial</option>
        <option value="1919,1938">Entreguerras</option>
        <option value="1939,1945">2ª Guerra Mundial</option>
        <option value="1946,9999">Pós-1945</option>
      </select>
      <button class="chip train" id="b-train">Treino</button>
    </div>
  </header>

  <section class="stage" aria-label="Globo 3D">
    <div id="cesium"></div>
    <div class="status" id="status">Carregando o globo…</div>
    <div class="hud">
      <div class="dtg" id="hud-dtg"></div>
      <div class="coord" id="hud-coord"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="maptools">
      <button class="tool" id="b-labels" aria-pressed="false" title="Nomes de lugares">Nomes</button>
      <button class="tool" id="b-home" title="Ver o globo inteiro">Globo</button>
    </div>
    <div class="caption" id="caption" hidden><h3 class="ph" id="cap-t"></h3><p id="cap-p"></p></div>
    <div class="transport" id="transport" hidden>
      <button class="tbtn" id="b-prev" aria-label="Fase anterior"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button class="tbtn play" id="b-play" aria-label="Reproduzir"><svg viewBox="0 0 16 16" id="ico-play"><path d="M4 2l10 6-10 6z"/></svg></button>
      <button class="tbtn" id="b-next" aria-label="Próxima fase"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
      <div class="track" id="track"></div>
      <button class="speed" id="b-speed" aria-label="Velocidade">1×</button>
    </div>
    <div id="credits"></div>
  </section>

  <aside id="aside"></aside>
</div>

<script src="config.js"></script>
<script>window.CESIUM_BASE_URL="https://cdn.jsdelivr.net/npm/cesium@1.139.1/Build/Cesium/";</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.139.1/Build/Cesium/Cesium.js"></script>
<script src="data/curadas-extra.js"></script>
<script src="data/curadas.js"></script>
<script src="app.js"></script>
</body>
</html>
